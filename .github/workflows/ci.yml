name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Ruff lint
        run: ruff check skills/ --output-format=github

      - name: Ruff format check
        run: ruff format --check skills/

  validate-skills:
    name: Validate SKILL.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md presence and structure
        run: |
          exit_code=0
          for dir in skills/*/; do
            skill=$(basename "$dir")
            if [ ! -f "$dir/SKILL.md" ]; then
              echo "::error::$skill: SKILL.md missing"
              exit_code=1
            else
              if ! grep -q "^name:" "$dir/SKILL.md"; then
                echo "::warning::$skill: missing 'name' in frontmatter"
              fi
              if ! grep -q "^description:" "$dir/SKILL.md"; then
                echo "::warning::$skill: missing 'description' in frontmatter"
              fi
              if ! grep -q "^version:" "$dir/SKILL.md"; then
                echo "::warning::$skill: missing 'version' in frontmatter"
              fi
              echo "✅ $skill"
            fi
          done
          exit $exit_code

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest>=8.0

      - name: Discover and run tests
        run: |
          test_files=$(find skills/ -name "test_*.py" -o -name "*_test.py" 2>/dev/null)
          if [ -z "$test_files" ]; then
            echo "No test files found, skipping"
          else
            # Install skill-specific dependencies
            for req in $(find skills/ -name "requirements.txt" -path "*/scripts/*"); do
              pip install -r "$req" 2>/dev/null || true
            done
            for toml in $(find skills/ -name "pyproject.toml"); do
              dir=$(dirname "$toml")
              pip install -e "$dir" 2>/dev/null || pip install "$dir" 2>/dev/null || true
            done
            pytest skills/ -v --tb=short || true
          fi
