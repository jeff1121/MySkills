# FinMind MCP Server — 部署設定
# 使用方式：docker compose up -d

services:
  finmind-mcp-server:
    image: jeffhou/finmind-mcp-server:latest
    container_name: finmind-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8080}:8080"
    environment:
      - FINMIND_TOKEN=${FINMIND_TOKEN}
      - FINMIND_API_BASE_URL=${FINMIND_API_BASE_URL:-https://api.finmindtrade.com/api/v4}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/sse"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
