[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pa-agent"
version = "0.1.0"
description = "Palo Alto NGFW Agent Skills — CLI & MCP server for PAN-OS firewall management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "boto3>=1.34,<2",
    "tenacity>=8.2,<10",
    "structlog>=24,<26",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "respx>=0.21,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "boto3-stubs[s3]>=1.34,<2",
]

[project.scripts]
pa-agent = "pa_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pa_agent"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
